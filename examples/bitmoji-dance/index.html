<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dancing Bitmoji (PlayCanvas)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b2f; touch-action: none; }
  #app { display: block; width: 100%; height: 100%; }
  #status {
    position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 12px);
    color: #fff; font: 14px system-ui; text-align: center; text-shadow: 0 1px 2px #000;
  }
</style>
</head>
<body>
<canvas id="app"></canvas>
<div id="status">loading…</div>
<!-- playcanvas.min.js and snap-api.js are copied next to this file by `npm run build:examples` -->
<script src="playcanvas.min.js"></script>
<script src="snap-api.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
